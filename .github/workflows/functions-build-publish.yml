name: Build and publish KeepAlive function

on:
  push:
    branches: [main]
    paths:
      - 'src/GHSFL.Rosters.KeepAliveFunction/**'
      - '.github/workflows/functions-build-publish.yml'
  workflow_dispatch: {}

env:
  AZURE_FUNCTIONAPP_NAME: GHSFL
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/GHSFL.Rosters.KeepAliveFunction
  PUBLISH_DIR: ${{ github.workspace }}/publish

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish function app
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --output "${{ env.PUBLISH_DIR }}"

      - name: Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
